<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <title>Grok2API 管理工作台</title>
  <style>
/*__HALLMARK_TOKENS__*/
/*__APP_STYLES__*/
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Grok2API 管理导航">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">G</span>
        <span><strong>Grok2API</strong><small>CPA 管理工作台</small></span>
      </div>
      <nav class="nav-list">
        <button type="button" class="nav-item" data-view="dashboard"><span class="nav-glyph">01</span><span>概览</span></button>
        <button type="button" class="nav-item" data-view="accounts"><span class="nav-glyph">02</span><span>账号</span></button>
        <button type="button" class="nav-item" data-view="egress"><span class="nav-glyph">03</span><span>出口守护</span></button>
        <button type="button" class="nav-item" data-view="models"><span class="nav-glyph">04</span><span>模型</span></button>
        <button type="button" class="nav-item" data-view="keys"><span class="nav-glyph">05</span><span>Client Key</span></button>
        <button type="button" class="nav-item" data-view="audits"><span class="nav-glyph">06</span><span>请求审计</span></button>
        <button type="button" class="nav-item" data-view="settings"><span class="nav-glyph">07</span><span>设置</span></button>
      </nav>
      <div class="sidebar-foot">
        <span class="status-dot" id="service-dot"></span>
        <span id="service-text">正在连接</span>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div class="topbar-title">
          <button id="menu-button" class="button icon ghost mobile-only" type="button" title="打开导航" aria-label="打开导航">☰</button>
          <div><h1 id="page-title">概览</h1><p id="page-subtitle">Grok2API 运行状态与资源概览</p></div>
        </div>
        <div class="topbar-actions">
          <button id="theme-button" class="button icon ghost" type="button" title="切换深浅色" aria-label="切换深浅色">◐</button>
          <button id="refresh-button" class="button" type="button">刷新</button>
        </div>
      </header>
      <div id="view-root" class="view-root" aria-live="polite"><div class="loading-panel">正在加载</div></div>
    </main>
  </div>

  <div id="sidebar-scrim" class="sidebar-scrim" hidden></div>
  <dialog id="form-dialog" class="dialog"><form method="dialog"><header><div><h2 id="form-dialog-title">编辑</h2><p id="form-dialog-description"></p></div><button class="button icon ghost" value="cancel" aria-label="关闭">×</button></header><div id="form-dialog-body" class="dialog-body"></div><footer><button class="button" value="cancel">取消</button><button id="form-dialog-submit" class="button primary" value="default">保存</button></footer></form></dialog>
  <dialog id="confirm-dialog" class="dialog compact"><form method="dialog"><header><div><h2 id="confirm-dialog-title">确认操作</h2><p id="confirm-dialog-description"></p></div></header><div id="confirm-dialog-body" class="dialog-body"></div><footer><button class="button" value="cancel">取消</button><button id="confirm-dialog-submit" class="button danger" value="default">确认</button></footer></form></dialog>
  <dialog id="detail-dialog" class="dialog wide"><form method="dialog"><header><div><h2 id="detail-dialog-title">详情</h2><p id="detail-dialog-description"></p></div><button class="button icon ghost" value="cancel" aria-label="关闭">×</button></header><div id="detail-dialog-body" class="dialog-body"></div><footer><button class="button" value="cancel">关闭</button></footer></form></dialog>
  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>

  <script>
/*__APP_SCRIPT__*/
  </script>
</body>
</html>
